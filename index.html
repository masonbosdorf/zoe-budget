<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Zoe's Budget" />
<meta name="theme-color" content="#191a22" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-180.png" />
<title>Zoe's Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ===== palette sampled from Up's Essentials screen ===== */
:root{
  --bg:#191a22; --card:#272733; --card-2:#2f2f3c; --sheet:#22222c;
  --text:#f4f4f7; --muted:#8f8f9c; --lbl:#7e7e84; --faint:#5d5d6a;
  --coral:#f77860; --yellow:#fbcc72; --ok:#5ed39b; --bad:#ff6b6b;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);}
body{background:var(--bg);color:var(--text);font-family:"Figtree",system-ui,-apple-system,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;overscroll-behavior-y:none;}
button,input,select{font:inherit;color:inherit;background:none;border:0;}
button{cursor:pointer;touch-action:manipulation;}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--coral);outline-offset:2px;}
[hidden]{display:none!important;}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 40px);}

/* ===== top bar ===== */
.top{height:52px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;}
.top .t{text-align:center;font-weight:600;font-size:17px;}
.top .ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:12px;font-size:22px;font-weight:700;}
.top .ib:active{background:var(--card);}
.top .ib.add{color:var(--coral);font-size:30px;font-weight:500;}

/* ===== gauge (measured from the reference: band 0.18R, 143° / 16° gap / 40°, ends ±100°) ===== */
.gauge{position:relative;margin:22px auto 0;width:min(372px,100%);aspect-ratio:372/232;}
.gauge svg{width:100%;height:100%;overflow:visible;display:block;}
.gauge .lbl{font-family:"Figtree",sans-serif;font-size:12px;font-weight:700;letter-spacing:0.15em;fill:var(--lbl);}
.center{position:absolute;left:0;right:0;top:43%;text-align:center;}
.bal{display:inline-flex;align-items:baseline;justify-content:center;color:var(--coral);font-weight:700;font-size:47px;line-height:1;letter-spacing:-0.01em;}
.bal .cur{margin-right:1px;}
.bal input{width:120px;min-width:40px;color:var(--coral);font-weight:700;font-size:47px;line-height:1;letter-spacing:-0.01em;text-align:left;outline:none;padding:0;caret-color:var(--coral);font-variant-numeric:tabular-nums;border-radius:8px;transition:background .15s;}
.bal input:focus{background:rgba(247,120,96,0.10);outline:none;}
.of{margin-top:9px;font-size:16px;color:var(--text);font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;}
.of .q{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border:1.5px solid var(--faint);border-radius:50%;color:var(--muted);font-size:10px;font-weight:700;}

/* ===== coverage strip ===== */
.status{display:flex;gap:10px;margin:10px 0 0;}
.status .s{flex:1;background:var(--card);border-radius:18px;padding:13px 16px;min-width:0;}
.status .k{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.status .v{font-size:18px;font-weight:700;margin-top:5px;}
.status .v.ok{color:var(--ok);} .status .v.bad{color:var(--bad);}
.status .sub{font-size:12.5px;color:var(--muted);margin-top:3px;}

/* ===== regulars ===== */
.sec{display:flex;align-items:center;gap:9px;margin:30px 0 14px;}
.sec h2{font-size:28px;font-weight:700;letter-spacing:-0.01em;}
.sec .n{background:var(--card-2);color:var(--text);border-radius:999px;padding:2px 9px;font-size:13px;font-weight:700;}
.sec .tot{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.rg{background:var(--card);border-radius:18px;padding:14px 13px 15px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .12s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.rg:active{transform:scale(0.97);}
.rg.due{box-shadow:inset 0 0 0 1.5px rgba(247,120,96,0.6);}
.rg .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
.logo{width:40px;height:40px;border-radius:9px;overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;}
.logo img,.logo svg{width:100%;height:100%;display:block;object-fit:cover;}
.rg .amt{color:var(--muted);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px;}
.rg .nm{font-size:15px;font-weight:600;letter-spacing:-0.01em;line-height:1.2;margin-top:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.rg .when{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.25;}
.rg .when b{color:var(--coral);font-weight:600;}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 20px;line-height:1.5;}
.foot{margin-top:28px;text-align:center;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--faint);}

/* ===== sheets ===== */
.dim{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;}
.dim.on{opacity:1;pointer-events:auto;}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:var(--sheet);border-radius:28px 28px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom) + 22px);transform:translateY(24px);transition:transform .2s;}
.dim.on .sheet{transform:none;}
.grab{width:38px;height:5px;border-radius:3px;background:#3b3b48;margin:0 auto 18px;}
.row{display:flex;align-items:center;gap:14px;}
.sheet .logo{width:52px;height:52px;border-radius:12px;font-size:22px;}
.sheet .nm{font-size:20px;font-weight:700;}
.sheet .sub{font-size:14px;color:var(--muted);margin-top:3px;}
.sheet .sub b{color:var(--coral);font-weight:600;}
.sheet .amt{margin-left:auto;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
.sheet .q{margin:22px 0 14px;font-size:16px;}
.sheet .q span{color:var(--muted);}
.btns{display:flex;gap:10px;}
.btns button{flex:1;height:52px;border-radius:16px;font-size:16px;font-weight:700;}
.yes{background:var(--coral);color:#1c1c25;} .no{background:var(--card-2);color:var(--text);} .del{background:rgba(255,107,107,0.14);color:var(--bad);}
.link{display:block;width:100%;text-align:center;margin-top:14px;color:var(--muted);font-weight:600;font-size:14px;padding:8px;}
.h{font-size:20px;font-weight:700;margin-bottom:16px;}
.f{margin-bottom:14px;}
.f label{display:block;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:7px;}
.f input[type=text],.f input[type=number],.f input[type=date],.f select{width:100%;height:48px;background:var(--card-2);border-radius:14px;padding:0 14px;font-size:16px;font-weight:600;color:var(--text);-webkit-appearance:none;appearance:none;}
.f input[type=date]{color-scheme:dark;}
.seg{display:flex;background:var(--card-2);border-radius:14px;padding:4px;gap:4px;}
.seg button{flex:1;height:38px;border-radius:11px;font-size:13px;font-weight:700;color:var(--muted);}
.seg button.on{background:var(--coral);color:#1c1c25;}
.dows{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.dows button{height:42px;border-radius:12px;background:var(--card-2);font-weight:700;font-size:13px;color:var(--muted);}
.dows button.on{background:var(--coral);color:#1c1c25;}
.logos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.logos .pick{aspect-ratio:1;border-radius:11px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;opacity:0.55;}
.logos .pick.on{opacity:1;box-shadow:0 0 0 2.5px var(--coral);}
.logos .pick img,.logos .pick svg{width:100%;height:100%;display:block;}
.swatches{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.swatches button{width:30px;height:30px;border-radius:50%;opacity:0.6;}
.swatches button.on{opacity:1;box-shadow:0 0 0 2.5px var(--text);}
.sw{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.sw .l{font-size:16px;font-weight:600;} .sw .d{font-size:12.5px;color:var(--muted);margin-top:2px;}
.tog{width:52px;height:32px;border-radius:999px;background:var(--card-2);position:relative;flex:0 0 auto;transition:background .15s;}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s;}
.tog.on{background:var(--coral);} .tog.on::after{transform:translateX(20px);}
.num{width:76px;height:40px;background:var(--card-2);border-radius:12px;text-align:center;font-weight:700;font-size:16px;}

/* ===== pull to refresh ===== */
.ptr{position:fixed;left:0;right:0;top:0;height:0;overflow:visible;z-index:15;pointer-events:none;display:flex;justify-content:center;}
.ptr .pill{margin-top:calc(env(safe-area-inset-top) + 10px);background:var(--card-2);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(-30px);transition:opacity .12s,transform .12s;}
.ptr.show .pill{opacity:1;transform:none;}
.ptr .pill.ready{color:var(--coral);}
.ptr .pill .sp{width:12px;height:12px;border:2px solid var(--faint);border-top-color:var(--coral);border-radius:50%;animation:spin .8s linear infinite;display:none;}
.ptr .pill.busy .sp{display:block;}
@keyframes spin{to{transform:rotate(360deg)}}
.pulling{transition:transform .15s;}

/* ===== lock: code pad + Face ID ===== */
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;}
.lock img{width:76px;height:76px;border-radius:19px;}
.lock .t{font-size:22px;font-weight:700;margin-top:4px;}
.lock .d{font-size:14px;color:var(--muted);text-align:center;min-height:20px;}
.dots{display:flex;gap:16px;margin:4px 0 16px;}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--faint);transition:background .1s,border-color .1s;}
.dots i.on{background:var(--coral);border-color:var(--coral);}
.dots.bad{animation:shake .35s;} .dots.bad i{border-color:var(--bad);}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;}
.pad button{width:76px;height:76px;border-radius:50%;background:var(--card);font-size:30px;font-weight:600;display:flex;align-items:center;justify-content:center;}
.pad button:active{background:var(--card-2);}
.pad button.k2{background:none;color:var(--muted);} #pad-face{color:var(--coral);}
.pad svg{width:30px;height:30px;}

/* ===== logo picker groups + photo tile ===== */
.gl{font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:0 0 7px;}
.logos + .gl{margin-top:14px;}
.logos .pick.photo{background:var(--card-2);color:var(--muted);}
.logos .pick.photo:not(.has){opacity:1;}
.logos .pick.photo:not(.has) svg{width:50%;height:50%;}

/* ===== history ===== */
.top{grid-template-columns:44px 1fr 88px;}
.top .r{display:flex;justify-content:flex-end;}
.top .ib svg{width:22px;height:22px;}
.hist{list-style:none;}
.hist .day{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 8px;}
.hist li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.hist .logo{width:36px;height:36px;border-radius:9px;font-size:15px;}
.hist .n{font-size:15px;font-weight:600;} .hist .s{font-size:12px;color:var(--muted);margin-top:1px;}
.hist .a{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;}
.hsum{display:flex;gap:10px;margin-bottom:6px;}
.hsum .s{flex:1;background:var(--card-2);border-radius:14px;padding:10px 12px;}
.hsum .k{font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-weight:700;} .hsum .v{font-size:17px;font-weight:700;margin-top:3px;}

/* ===== toast ===== */
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:30;max-width:448px;margin:0 auto;background:#2c2c38;border-radius:16px;padding:13px 16px;display:flex;align-items:center;gap:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,0.5);transform:translateY(20px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;}
.toast.on{opacity:1;transform:none;pointer-events:auto;}
.toast b{font-weight:700;} .toast .undo{margin-left:auto;color:var(--coral);font-weight:700;font-size:14px;padding:6px 4px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="ib" id="btn-settings" aria-label="Settings">&#x2026;</button>
    <div class="t">Regular Expenses</div>
    <div class="r"><button class="ib" id="btn-history" aria-label="History"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button><button class="ib add" id="btn-add" aria-label="Add a regular">+</button></div>
  </header>

  <div class="gauge">
    <svg viewBox="0 0 372 232" id="g"></svg>
    <div class="center">
      <div class="bal"><span class="cur">$</span><input id="bal" type="text" inputmode="decimal" pattern="[0-9.]*" value="0" aria-label="Balance in bills account" /></div>
      <div class="of" id="of"></div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="sec"><h2>Regulars</h2><span class="n" id="cnt">0</span><div class="tot" id="tot"></div></div>
  <div class="grid" id="grid"></div>
  <div class="foot">Tap a regular when it's paid · hold to edit</div>
</div>

<div class="ptr" id="ptr"><div class="pill" id="ptr-pill"><span class="sp"></span><span id="ptr-t">Pull to refresh</span></div></div>
<div class="lock" id="lock">
  <img src="icon-180.png" alt="" />
  <div class="t">Zoe's Budget</div>
  <div class="d" id="lock-d">Enter your code</div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="k2" id="pad-face" type="button" aria-label="Unlock with Face ID" style="visibility:hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10v1M15 10v1M12 10v3h-1"/><path d="M9.5 15.5a3.5 3.5 0 0 0 5 0"/></svg></button><button data-k="0">0</button><button class="k2" data-k="del" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17.5 9.5l-5 5M12.5 9.5l5 5"/></svg></button></div>
</div>
<div class="dim" id="dim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="application/json" hidden />
<input type="file" id="photo" accept="image/*" hidden />

<script>
/* ============================================================
   Zoe's Budget — a copy of Regulars (recurring bills on the phone). Data lives in localStorage only.
   Starts empty; logos are emoji presets, brand marks, or a photo from the camera roll.
   bill: { id, name, amt, period:'w'|'f'|'m'|'q'|'y', dow (w), day (m), next (f/q/y ISO anchor), logo, color, img (logo 'photo') }
   ============================================================ */
const $ = id => document.getElementById(id);
const PERIOD = { w: 'Weekly', f: 'Fortnightly', m: 'Monthly', q: 'Quarterly', y: 'Yearly' };
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

/* ---------- dates ---------- */
const today = new Date(); today.setHours(0, 0, 0, 0);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth() + n, 1); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(d.getDate(), last)); return x; };
const clampDay = (y, m, day) => new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()));
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d || 1); };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function nextDueRaw(b, from) {
  if (b.period === 'w') { const diff = ((b.dow ?? 1) - from.getDay() + 7) % 7; return addDays(from, diff); }
  if (b.period === 'm') { let d = clampDay(from.getFullYear(), from.getMonth(), b.day || 1); if (d < from) d = clampDay(from.getFullYear(), from.getMonth() + 1, b.day || 1); return d; }
  let d = b.next ? parseISO(b.next) : new Date(today);
  const step = b.period === 'f' ? x => addDays(x, 14) : b.period === 'q' ? x => addMonths(x, 3) : x => addMonths(x, 12);
  let guard = 0; while (d < from && guard++ < 2000) d = step(d);
  return d;
}
function paidFrom(b, from) { const p = PAID[b.id]; if (!p) return from; const d = addDays(parseISO(p), 1); return d > from ? d : from; }
const nextDue = (b, from = today) => nextDueRaw(b, paidFrom(b, from));
function occurrences(b, from, to) { const out = []; let d = nextDue(b, from); let g = 0; while (d <= to && g++ < 100) { out.push(d); d = nextDueRaw(b, addDays(d, 1)); } return out; }
const monthly = b => ({ w: b.amt * 52 / 12, f: b.amt * 26 / 12, m: b.amt, q: b.amt / 3, y: b.amt / 12 })[b.period] || b.amt;
const money = n => '$' + (Math.round(n * 100) / 100).toLocaleString('en-AU', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
const mon = d => d.toLocaleString('en-AU', { month: 'short' });
const fullDate = d => d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
function whenLabel(d) {
  const diff = Math.round((d - today) / 86400000);
  if (diff < 0) return `<b>${-diff}d overdue</b>`; if (diff === 0) return '<b>Today</b>'; if (diff === 1) return '<b>Tomorrow</b>';
  if (diff < 7) return DOW[d.getDay()];
  return d.getDate() + ' ' + mon(d);
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function logoHTML(b) {
  if (b.logo === 'photo' && b.img) return `<img src="${esc(b.img)}" alt="">`;
  if (b.logo && LOGOS[b.logo]) return LOGOS[b.logo];
  const ch = (b.name || '?').trim()[0] || '?';
  return `<span class="logo" style="background:${b.color || '#8f8f9c'};width:100%;height:100%;border-radius:0">${esc(ch.toUpperCase())}</span>`;
}

/* ---------- gauge (all sizes are ratios of R, measured from the reference) ---------- */
const R = 140, cx = 186, cy = 166, W = R * 0.18;
const A0 = 260, A1 = A0 + 143, B0 = A1 + 16, B1 = B0 + 40;
const pol = (a, r = R) => { const t = (a - 90) * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };
function arc(a0, a1, r = R) { if (a1 - a0 < 0.5) return ''; const [x0, y0] = pol(a0, r), [x1, y1] = pol(a1, r); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; }
function drawGauge(bal, needA, needB) {
  const fillA = A0 + (A1 - A0) * Math.min(1, needA ? bal / needA : 1);
  const fillB = B0 + (B1 - B0) * Math.min(1, needB ? Math.max(0, bal - needA) / needB : 1);
  const RL = R * 1.22, span = B1 - A0, off = a => (((a - A0) / span) * 100).toFixed(1) + '%';
  const [gx0, gy0] = pol(B0), [gx1, gy1] = pol(B1);
  const la = SET.windowA === 7 ? 'THIS WEEK' : SET.windowA === 14 ? 'THIS FORTNIGHT' : `NEXT ${SET.windowA} DAYS`;
  $('g').innerHTML = `
    <defs>
      <linearGradient id="later" gradientUnits="userSpaceOnUse" x1="${gx0.toFixed(1)}" y1="${gy0.toFixed(1)}" x2="${gx1.toFixed(1)}" y2="${gy1.toFixed(1)}"><stop offset="0" stop-color="#f79068"/><stop offset="1" stop-color="#fbcc72"/></linearGradient>
      <filter id="glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="452" height="312"><feGaussianBlur stdDeviation="6" result="b"/><feComponentTransfer in="b" result="c"><feFuncA type="linear" slope="0.5"/></feComponentTransfer><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <path id="lp" d="${arc(A0, B1, RL)}" fill="none"/>
    </defs>
    <path d="${arc(A0, A1)}" stroke="rgba(247,120,96,0.18)" stroke-width="${W}" fill="none" stroke-linecap="round"/>
    <path d="${arc(B0, B1)}" stroke="rgba(251,204,114,0.16)" stroke-width="${W}" fill="none" stroke-linecap="round"/>
    <path d="${arc(A0, fillA)}" stroke="var(--coral)" stroke-width="${W}" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    <path d="${arc(B0, fillB)}" stroke="url(#later)" stroke-width="${W}" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    <text class="lbl"><textPath href="#lp" startOffset="${off(360 - 43)}" text-anchor="middle">${la}</textPath></text>
    <text class="lbl"><textPath href="#lp" startOffset="${off(360 + 78)}" text-anchor="middle">LATER</textPath></text>`;
}

/* ---------- render ---------- */
function render() {
  // both windows count from TODAY: This = next windowA days, Later = the rest of the next windowB days (e.g. days 8–14)
  const endA = addDays(today, SET.windowA - 1), endB = addDays(today, Math.max(SET.windowB, SET.windowA + 1) - 1);
  let needA = 0, needB = 0;
  const cards = BILLS.map(b => {
    const oa = occurrences(b, today, endA), ob = occurrences(b, addDays(endA, 1), endB);
    needA += oa.length * b.amt; needB += ob.length * b.amt;
    return { b, next: nextDue(b) };
  }).sort((x, y) => x.next - y.next || y.b.amt - x.b.amt);
  drawGauge(balance, needA, needB);
  $('of').innerHTML = `<span>of <b>${money(needA)}</b></span><span class="q" title="Due in the next ${SET.windowA} days">?</span>`;
  const shortA = Math.max(0, needA - balance), shortB = Math.max(0, needA + needB - balance), left = balance - needA - needB;
  const laterName = SET.windowB === 14 ? 'Next fortnight' : `Next ${SET.windowB} days`;
  const thisName = SET.windowA === 7 ? 'This week' : SET.windowA === 14 ? 'This fortnight' : `Next ${SET.windowA} days`;
  $('status').innerHTML = `
    <div class="s"><div class="k">${thisName}</div><div class="v ${shortA ? 'bad' : 'ok'}">${shortA ? money(shortA) + ' short' : 'Covered'}</div><div class="sub">${money(needA)} due by ${endA.getDate()} ${mon(endA)}</div></div>
    <div class="s"><div class="k">${laterName}</div><div class="v ${shortB ? 'bad' : 'ok'}">${shortB ? money(shortB) + ' short' : 'Covered'}</div><div class="sub">${money(needB)} more to ${endB.getDate()} ${mon(endB)}${left >= 0 ? ' · ' + money(left) + ' spare' : ''}</div></div>`;
  $('cnt').textContent = BILLS.length;
  const perMonth = BILLS.reduce((a, b) => a + monthly(b), 0);
  $('tot').innerHTML = `<b>${money(perMonth)}</b> / month<br>${money(perMonth * 12 / 26)} / fortnight`;
  $('grid').innerHTML = cards.length ? cards.map(({ b, next }) => `
    <div class="rg${+next <= +today ? ' due' : ''}" data-id="${esc(b.id)}">
      <div class="hd"><div class="logo">${logoHTML(b)}</div><div class="amt">${money(b.amt)}</div></div>
      <div><div class="nm">${esc(b.name)}</div><div class="when">${PERIOD[b.period]} · ${whenLabel(next)}</div></div>
    </div>`).join('') : `<div class="empty">No regulars yet.<br>Tap <b>+</b> to add your first bill.</div>`;
}

/* ---------- balance input ---------- */
const bal = $('bal'); bal.value = String(balance || 0);
const mirror = document.createElement('span'); mirror.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font:inherit;'; bal.parentNode.appendChild(mirror);
const fit = () => { mirror.textContent = bal.value || '0'; bal.style.width = (mirror.offsetWidth + 6) + 'px'; };
bal.addEventListener('input', () => { bal.value = bal.value.replace(/[^0-9.]/g, ''); balance = parseFloat(bal.value) || 0; save('zb_bal', balance); fit(); render(); });
bal.addEventListener('focus', () => bal.select());
bal.addEventListener('keydown', e => { if (e.key === 'Enter') bal.blur(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

/* ---------- sheets ---------- */
let sheetBill = null, editing = null, undo = null, toastT = null, autoName = '';
function openSheet(html) { $('sheet').innerHTML = html; $('dim').classList.add('on'); }
function closeSheet() { $('dim').classList.remove('on'); sheetBill = null; editing = null; }
function toast(html, ms = 5000) { $('toast').innerHTML = html; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), ms); }

/* paid sheet */
function openPaid(b) {
  sheetBill = b; const next = nextDue(b), after = nextDueRaw(b, addDays(next, 1));
  openSheet(`<div class="grab"></div>
    <div class="row"><div class="logo">${logoHTML(b)}</div><div><div class="nm">${esc(b.name)}</div><div class="sub">${PERIOD[b.period]} · due ${whenLabel(next)}</div></div><div class="amt">${money(b.amt)}</div></div>
    <div class="q">Paid this one? <span>It'll move to ${fullDate(after)}${SET.subtract ? ` and ${money(b.amt)} comes off the balance` : ''}.</span></div>
    <div class="btns"><button class="no" data-act="close">Not yet</button><button class="yes" data-act="paid">Done</button></div>
    <button class="link" data-act="edit">Edit this regular</button>`);
}
function markPaid(b) {
  const next = nextDue(b); undo = { id: b.id, prev: PAID[b.id], bal: balance };
  PAID[b.id] = iso(next); save('zb_paid', PAID);
  HIST.unshift({ id: b.id, name: b.name, amt: b.amt, due: iso(next), at: new Date().toISOString() }); HIST = HIST.slice(0, 500); save('zb_history', HIST);
  if (SET.subtract) { balance = Math.max(0, Math.round((balance - b.amt) * 100) / 100); save('zb_bal', balance); bal.value = String(balance); fit(); }
  closeSheet(); render();
  toast(`<span><b>${esc(b.name)}</b> moved to ${fullDate(nextDue(b))}</span><button class="undo" id="undo">Undo</button>`);
}

/* edit / add sheet */
function openEdit(b) {
  editing = b ? { ...b } : { id: 'b' + Date.now().toString(36), name: '', amt: '', period: 'm', day: today.getDate(), dow: 1, next: iso(today), logo: '', color: COLORS[0] };
  const e = editing; autoName = '';
  const tile = k => `<button class="pick${e.logo === k ? ' on' : ''}" data-logo="${k}" data-name="${esc(NAMES[k])}" type="button" aria-label="${esc(NAMES[k])}">${LOGOS[k]}</button>`;
  const picks = `<div class="gl">Common bills</div><div class="logos">`
    + `<button class="pick photo${e.img ? ' has' : ''}${e.logo === 'photo' ? ' on' : ''}" data-logo="photo" type="button" aria-label="Photo from camera roll">${e.img ? `<img src="${esc(e.img)}" alt="">` : CAM}</button>`
    + EMOJI_KEYS.map(tile).join('')
    + `<button class="pick${!e.logo ? ' on' : ''}" data-logo="" type="button" style="background:${e.color || COLORS[0]}">${esc((e.name || 'A').trim()[0] || 'A').toUpperCase()}</button>`
    + `</div><div class="gl">Brands</div><div class="logos">${BRAND_KEYS.map(tile).join('')}</div>`;
  openSheet(`<div class="grab"></div><div class="h">${b ? 'Edit regular' : 'New regular'}</div>
    <div class="f"><label>Name</label><input type="text" id="e-name" value="${esc(e.name)}" placeholder="e.g. Spotify" autocomplete="off"></div>
    <div class="f"><label>Amount</label><input type="number" id="e-amt" value="${e.amt}" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></div>
    <div class="f"><label>Period</label><div class="seg" id="e-period">${Object.entries(PERIOD).map(([k, v]) => `<button type="button" data-p="${k}" class="${e.period === k ? 'on' : ''}">${v.replace('Fortnightly', '2 wks').replace('Quarterly', 'Qtrly')}</button>`).join('')}</div></div>
    <div class="f" id="f-dow" ${e.period === 'w' ? '' : 'hidden'}><label>Day</label><div class="dows" id="e-dow">${DOW.map((d, i) => `<button type="button" data-d="${i}" class="${e.dow === i ? 'on' : ''}">${d}</button>`).join('')}</div></div>
    <div class="f" id="f-day" ${e.period === 'm' ? '' : 'hidden'}><label>Day of month</label><input type="number" id="e-day" value="${e.day || 1}" min="1" max="31" inputmode="numeric"></div>
    <div class="f" id="f-next" ${'fqy'.includes(e.period) ? '' : 'hidden'}><label>Next due</label><input type="date" id="e-next" value="${e.next || iso(today)}"></div>
    <div class="f"><label>Logo</label><div id="e-logos">${picks}</div><div class="swatches" id="e-colors" ${e.logo ? 'hidden' : ''}>${COLORS.map(c => `<button type="button" data-c="${c}" style="background:${c}" class="${e.color === c ? 'on' : ''}"></button>`).join('')}</div></div>
    <div class="btns">${b ? '<button class="del" data-act="delete">Delete</button>' : '<button class="no" data-act="close">Cancel</button>'}<button class="yes" data-act="save">Save</button></div>
    ${b ? '<button class="link" data-act="close">Cancel</button>' : ''}`);
  setTimeout(() => { if (!b) $('e-name').focus(); }, 50);
}
function saveEdit() {
  const e = editing; e.name = $('e-name').value.trim(); e.amt = parseFloat($('e-amt').value) || 0;
  if (!e.name) { $('e-name').focus(); return; }
  if (e.logo !== 'photo') delete e.img;
  if (e.period === 'm') e.day = Math.min(31, Math.max(1, parseInt($('e-day').value, 10) || 1));
  if ('fqy'.includes(e.period)) e.next = $('e-next').value || iso(today);
  const i = BILLS.findIndex(x => x.id === e.id); if (i >= 0) BILLS[i] = e; else BILLS.push(e);
  save('zb_bills', BILLS); closeSheet(); render();
}
function deleteBill(id) {
  const b = BILLS.find(x => x.id === id); BILLS = BILLS.filter(x => x.id !== id); delete PAID[id]; save('zb_bills', BILLS); save('zb_paid', PAID); closeSheet(); render();
  undo = { restore: b }; toast(`<span><b>${esc(b.name)}</b> deleted</span><button class="undo" id="undo">Undo</button>`);
}

function pickLogo(l) {
  editing.logo = l.dataset.logo; $('e-logos').querySelectorAll('.pick').forEach(x => x.classList.toggle('on', x === l)); $('e-colors').hidden = !!editing.logo;
  const nm = $('e-name'), n = l.dataset.name;
  if (n && (!nm.value.trim() || nm.value === autoName)) { nm.value = autoName = n; nm.dispatchEvent(new Event('input', { bubbles: true })); }
}
/* photo from the camera roll → centre-cropped 192px JPEG stored on the bill */
$('photo').addEventListener('change', () => {
  const f = $('photo').files[0]; $('photo').value = ''; if (!f || !editing) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const S = 192, c = document.createElement('canvas'), x = c.getContext('2d'), side = Math.min(im.naturalWidth, im.naturalHeight);
    c.width = c.height = S; x.fillStyle = '#fff'; x.fillRect(0, 0, S, S);
    x.drawImage(im, (im.naturalWidth - side) / 2, (im.naturalHeight - side) / 2, side, side, 0, 0, S, S);
    URL.revokeObjectURL(url);
    editing.img = c.toDataURL('image/jpeg', 0.85);
    const t = $('e-logos') && $('e-logos').querySelector('[data-logo="photo"]'); if (!t) return;
    t.innerHTML = `<img src="${editing.img}" alt="">`; t.classList.add('has'); pickLogo(t);
  };
  im.onerror = () => { URL.revokeObjectURL(url); toast('<span>Couldn\'t read that image</span>'); };
  im.src = url;
});

/* history sheet */
function openHistory() {
  const now = new Date(), m0 = new Date(now.getFullYear(), now.getMonth(), 1);
  const thisMonth = HIST.filter(x => new Date(x.at) >= m0).reduce((a, x) => a + x.amt, 0);
  const d30 = HIST.filter(x => now - new Date(x.at) < 30 * 86400000).reduce((a, x) => a + x.amt, 0);
  let lastDay = '', rows = '';
  for (const x of HIST) {
    const at = new Date(x.at), day = at.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
    if (day !== lastDay) { rows += `<div class="day">${day}</div>`; lastDay = day; }
    const b = BILLS.find(y => y.id === x.id) || { name: x.name, logo: '', color: '#8f8f9c' };
    rows += `<li><div class="logo">${logoHTML(b)}</div><div><div class="n">${esc(x.name)}</div><div class="s">was due ${fullDate(parseISO(x.due))} · ${at.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' })}</div></div><div class="a">${money(x.amt)}</div></li>`;
  }
  openSheet(`<div class="grab"></div><div class="h">History</div>
    <div class="hsum"><div class="s"><div class="k">Paid this month</div><div class="v">${money(thisMonth)}</div></div><div class="s"><div class="k">Last 30 days</div><div class="v">${money(d30)}</div></div><div class="s"><div class="k">Marked done</div><div class="v">${HIST.length}</div></div></div>
    ${HIST.length ? `<ul class="hist">${rows}</ul>` : '<div class="empty">Nothing yet. Tap a regular and press Done when you pay it.</div>'}
    ${HIST.length ? '<button class="link" data-act="clear-history">Clear history</button>' : ''}
    <div class="btns" style="margin-top:14px"><button class="yes" data-act="close">Done</button></div>`);
}

/* settings sheet */
function openSettings() {
  openSheet(`<div class="grab"></div><div class="h">Settings</div>
    <div class="sw"><div><div class="l">This window</div><div class="d">Days the first segment covers</div></div><input class="num" type="number" id="s-a" value="${SET.windowA}" min="1" max="60" inputmode="numeric"></div>
    <div class="sw"><div><div class="l">Later window</div><div class="d">Days from today the second segment reaches</div></div><input class="num" type="number" id="s-b" value="${SET.windowB}" min="1" max="120" inputmode="numeric"></div>
    <div class="sw"><div><div class="l">Face ID on open</div><div class="d">${webauthnOK() ? 'Unlock with Face ID instead of typing the code' : 'Not available in this browser'}</div></div><button class="tog${SET.faceid ? ' on' : ''}" id="s-face" type="button" aria-label="Toggle" ${webauthnOK() ? '' : 'disabled'}></button></div>
    <div class="sw"><div><div class="l">Done takes it off the balance</div><div class="d">Subtract the amount when you mark a bill paid</div></div><button class="tog${SET.subtract ? ' on' : ''}" id="s-sub" type="button" aria-label="Toggle"></button></div>
    <div class="sw"><div><div class="l">Export</div><div class="d">Save your regulars as a file</div></div><button class="no" style="height:40px;padding:0 16px;border-radius:12px;font-weight:700" data-act="export">Export</button></div>
    <div class="sw"><div><div class="l">Import</div><div class="d">Restore from a file (replaces everything)</div></div><button class="no" style="height:40px;padding:0 16px;border-radius:12px;font-weight:700" data-act="import">Import</button></div>
    <div class="sw" style="border:0"><div><div class="l">Start again</div><div class="d">Delete every bill and the history</div></div><button class="del" style="height:40px;padding:0 16px;border-radius:12px;font-weight:700" data-act="reset">Reset</button></div>
    <div class="btns" style="margin-top:14px"><button class="yes" data-act="save-settings">Done</button></div>`);
}
function exportData() {
  const data = { app: 'zoe-budget', exported: new Date().toISOString(), bills: BILLS, paid: PAID, history: HIST, settings: { ...SET, cred: null, faceid: false }, balance };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), name = 'zoe-budget-' + iso(today) + '.json';
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: "Zoe's Budget backup" }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('file').addEventListener('change', async () => {
  const f = $('file').files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!Array.isArray(d.bills)) throw 0;
    BILLS = d.bills; PAID = d.paid || {}; HIST = d.history || []; SET = Object.assign(SET, d.settings || {}, { cred: SET.cred, faceid: SET.faceid }); balance = d.balance || 0;
    save('zb_bills', BILLS); save('zb_paid', PAID); save('zb_history', HIST); save('zb_settings', SET); save('zb_bal', balance); bal.value = String(balance); fit(); closeSheet(); render(); toast('<span>Imported <b>' + BILLS.length + '</b> regulars</span>');
  } catch (e) { toast('<span>That file isn\'t a budget backup</span>'); }
  $('file').value = '';
});

/* ---------- events ---------- */
let pressT = null, pressed = false;
$('grid').addEventListener('pointerdown', e => { const c = e.target.closest('.rg'); if (!c) return; pressed = false; pressT = setTimeout(() => { pressed = true; openEdit(BILLS.find(b => b.id === c.dataset.id)); if (navigator.vibrate) navigator.vibrate(20); }, 480); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => $('grid').addEventListener(ev, () => clearTimeout(pressT)));
$('grid').addEventListener('contextmenu', e => e.preventDefault());
$('grid').addEventListener('click', e => { const c = e.target.closest('.rg'); if (!c || pressed) { pressed = false; return; } openPaid(BILLS.find(b => b.id === c.dataset.id)); });
$('btn-add').addEventListener('click', () => openEdit(null));
$('btn-settings').addEventListener('click', openSettings);
$('btn-history').addEventListener('click', openHistory);
$('dim').addEventListener('click', e => {
  if (e.target.id === 'dim') return closeSheet();
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'close') closeSheet();
  else if (act === 'paid' && sheetBill) markPaid(sheetBill);
  else if (act === 'edit' && sheetBill) openEdit(sheetBill);
  else if (act === 'save') saveEdit();
  else if (act === 'delete' && editing) deleteBill(editing.id);
  else if (act === 'export') exportData();
  else if (act === 'clear-history') { if (confirm('Clear the history list? Bills keep their dates.')) { HIST = []; save('zb_history', HIST); openHistory(); } }
  else if (act === 'import') $('file').click();
  else if (act === 'reset') { if (confirm('Delete every bill and the history? This can\'t be undone.')) { BILLS = []; PAID = {}; HIST = []; save('zb_bills', BILLS); save('zb_paid', PAID); save('zb_history', HIST); closeSheet(); render(); } }
  else if (act === 'face-on') { closeSheet(); enrolFace(null); }
  else if (act === 'save-settings') { SET.windowA = Math.max(1, parseInt($('s-a').value, 10) || 7); SET.windowB = Math.max(SET.windowA + 1, parseInt($('s-b').value, 10) || 14); save('zb_settings', SET); closeSheet(); render(); }
  const p = e.target.closest('#e-period button'); if (p && editing) { editing.period = p.dataset.p; [...p.parentNode.children].forEach(x => x.classList.toggle('on', x === p)); $('f-dow').hidden = editing.period !== 'w'; $('f-day').hidden = editing.period !== 'm'; $('f-next').hidden = !'fqy'.includes(editing.period); }
  const d = e.target.closest('#e-dow button'); if (d && editing) { editing.dow = +d.dataset.d; [...d.parentNode.children].forEach(x => x.classList.toggle('on', x === d)); }
  const l = e.target.closest('#e-logos .pick'); if (l && editing) { if (l.dataset.logo === 'photo' && (!editing.img || editing.logo === 'photo')) $('photo').click(); else pickLogo(l); }
  const c = e.target.closest('#e-colors button'); if (c && editing) { editing.color = c.dataset.c; [...c.parentNode.children].forEach(x => x.classList.toggle('on', x === c)); const lp = $('e-logos').querySelector('[data-logo=""]'); if (lp) lp.style.background = editing.color; }
  if (e.target.id === 's-sub') { SET.subtract = !SET.subtract; e.target.classList.toggle('on', SET.subtract); save('zb_settings', SET); }
  if (e.target.id === 's-face') { if (SET.faceid) { SET.faceid = false; SET.cred = null; save('zb_settings', SET); e.target.classList.remove('on'); } else enrolFace(e.target); }
});
$('sheet').addEventListener('input', e => { if (e.target.id === 'e-name' && editing) { const lp = $('e-logos').querySelector('[data-logo=""]'); if (lp) lp.textContent = (e.target.value.trim()[0] || 'A').toUpperCase(); } });
$('toast').addEventListener('click', e => {
  if (e.target.id !== 'undo' || !undo) return;
  if (undo.restore) { BILLS.push(undo.restore); save('zb_bills', BILLS); }
  else { if (undo.prev) PAID[undo.id] = undo.prev; else delete PAID[undo.id]; save('zb_paid', PAID); if (HIST[0] && HIST[0].id === undo.id) { HIST.shift(); save('zb_history', HIST); } if (undo.bal != null && SET.subtract) { balance = undo.bal; save('zb_bal', balance); bal.value = String(balance); fit(); } }
  undo = null; $('toast').classList.remove('on'); render();
});
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { const t = new Date(); t.setHours(0, 0, 0, 0); if (+t !== +today) location.reload(); } });   // new day → fresh dates

/* ---------- Face ID: a passkey on this phone, verified locally. Nothing leaves the device; the
   platform authenticator (Face ID / Touch ID / passcode) is the gate. It protects the screen, not
   the storage — same trade-off as any app lock without a server. ---------- */
const webauthnOK = () => !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.get && window.isSecureContext);
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const b64 = u8 => btoa(String.fromCharCode(...u8)); const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function enrolFace(tog) {
  if (!webauthnOK()) return;
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { name: "Zoe's Budget" }, user: { id: rnd(16), name: 'zoe-budget', displayName: "Zoe's Budget" }, challenge: rnd(32),
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' }, timeout: 60000 } });
    SET.cred = b64(new Uint8Array(cred.rawId)); SET.faceid = true; save('zb_settings', SET); if (tog) tog.classList.add('on');
    toast('<span>Face ID is on. It\'ll ask next time you open the app.</span>');
  } catch (e) { toast('<span>Couldn\'t set up Face ID' + (e && e.name === 'NotAllowedError' ? ' — cancelled' : '') + '</span>'); }
}
async function verifyFace() {
  const opts = { challenge: rnd(32), userVerification: 'required', timeout: 60000 };
  if (SET.cred) opts.allowCredentials = [{ type: 'public-key', id: unb64(SET.cred), transports: ['internal'] }];
  const a = await navigator.credentials.get({ publicKey: opts });
  return !!a;
}
/* ---------- entry: the 6-digit code, or Face ID once it's on. A screen gate, not encryption (the
   code is in this public file). Reloads in the same session (pull to refresh, auto-update, new day)
   stay unlocked unless the app was away for over a minute. ---------- */
const CODE = '100123';
const ss = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } };
let locked = false, entry = '';
const dots = () => $('dots').querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i < entry.length));
const faceReady = () => SET.faceid && webauthnOK();
function lock() {
  locked = true; entry = ''; dots(); ss('zb_ok', null);
  $('lock').hidden = false; $('lock-d').textContent = faceReady() ? 'Use Face ID or enter your code' : 'Enter your code';
  $('pad-face').style.visibility = faceReady() ? 'visible' : 'hidden';
  if (faceReady()) setTimeout(tryFace, 350);   // ask straight away; the Face ID key is there if iOS wants a tap first
}
function unlockNow() {
  locked = false; entry = ''; dots(); $('lock').hidden = true; ss('zb_ok', '1'); ss('zb_hid', null);
  if (!SET.faceid && !SET.faceAsked && webauthnOK()) setTimeout(offerFace, 400);
}
async function tryFace() {
  if (!locked || !faceReady()) return;
  try { if (await verifyFace()) unlockNow(); }
  catch (e) { if (locked) $('lock-d').textContent = e && e.name === 'NotAllowedError' ? 'Face ID cancelled — enter your code' : 'Face ID didn\'t work — enter your code'; }
}
function press(k) {
  if (!locked || (entry.length >= 6 && k !== 'del')) return;
  entry = k === 'del' ? entry.slice(0, -1) : entry + k; dots(); $('dots').classList.remove('bad');
  if (entry.length < 6) return;
  if (entry === CODE) { setTimeout(unlockNow, 120); return; }
  $('dots').classList.add('bad'); $('lock-d').textContent = 'Wrong code — try again'; if (navigator.vibrate) navigator.vibrate(60);
  setTimeout(() => { entry = ''; dots(); }, 380);
}
function offerFace() {   // once, after the first unlock with the code
  SET.faceAsked = true; save('zb_settings', SET);
  openSheet(`<div class="grab"></div><div class="h">Use Face ID?</div>
    <div class="q" style="margin-top:0"><span>Unlock with Face ID next time instead of typing the code. You can change this in settings.</span></div>
    <div class="btns"><button class="no" data-act="close">Not now</button><button class="yes" data-act="face-on">Turn on</button></div>`);
}
$('pad').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.id === 'pad-face') tryFace(); else press(b.dataset.k); });
addEventListener('keydown', e => { if (!locked) return; if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); });
{ const hid = +ss('zb_hid') || 0; if (ss('zb_ok') === '1' && (!hid || Date.now() - hid < 60000)) { $('lock').hidden = true; ss('zb_hid', null); } else lock(); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { ss('zb_hid', String(Date.now())); return; }
  const hid = +ss('zb_hid') || 0; ss('zb_hid', null);
  if (!locked && hid && Date.now() - hid > 60000) lock();   // away over a minute → re-lock
});

/* ---------- pull to refresh (home-screen apps have no browser one) ---------- */
(() => {
  const ptr = $('ptr'), pill = $('ptr-pill'), txt = $('ptr-t'), app = document.querySelector('.app'); let y0 = null, dy = 0, active = false;
  const TH = 78;
  addEventListener('touchstart', e => { if (locked || $('dim').classList.contains('on')) return; if (scrollY <= 0 && e.touches.length === 1) { y0 = e.touches[0].clientY; active = false; } else y0 = null; }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 == null) return; dy = e.touches[0].clientY - y0;
    if (dy > 8 && scrollY <= 0) { active = true; const d = Math.min(dy, 140) * 0.55; app.style.transform = `translateY(${d}px)`; ptr.classList.add('show'); pill.classList.toggle('ready', dy > TH); txt.textContent = dy > TH ? 'Release to refresh' : 'Pull to refresh'; }
  }, { passive: true });
  addEventListener('touchend', () => {
    if (!active) { y0 = null; return; }
    app.classList.add('pulling');
    if (dy > TH) { pill.classList.add('busy'); txt.textContent = 'Refreshing'; app.style.transform = 'translateY(40px)'; setTimeout(() => location.reload(), 250); }
    else { app.style.transform = ''; ptr.classList.remove('show'); }
    setTimeout(() => app.classList.remove('pulling'), 200); y0 = null; dy = 0; active = false;
  }, { passive: true });
})();

/* ---------- auto-update: every 10 min compare index.html's ETag with the one loaded; reload when idle ---------- */
(() => {
  let tag = null, pending = false;
  const etag = async () => { try { const r = await fetch('index.html', { method: 'HEAD', cache: 'no-store' }); return r.ok ? (r.headers.get('etag') || r.headers.get('last-modified')) : null; } catch (e) { return null; } };
  const idle = () => !$('dim').classList.contains('on') && !locked && document.activeElement !== bal;
  const check = async () => { const t = await etag(); if (!t) return; if (tag == null) { tag = t; return; } if (t !== tag) { pending = true; if (idle()) location.reload(); } };
  etag().then(t => { tag = t; });
  setInterval(check, 10 * 60 * 1000);
  setInterval(() => { if (pending && idle()) location.reload(); }, 30 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
})();

fit(); render();
</script>
</body>
</html>
